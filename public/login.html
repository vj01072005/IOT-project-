<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sky - Authentication | IoT System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            dark: {
              bg: '#070d0a',
              card: '#0e1713',
              surface: '#14221b',
              border: '#1c3427',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#070d0a] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-black">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Header Nav -->
  <header class="border-b border-[#1c3427] bg-[#0e1713]/80 backdrop-blur-md px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i data-lucide="cloud-lightning" class="w-6 h-6 text-black"></i>
        </div>
        <div>
          <span class="text-2xl font-black tracking-wider text-white">sky</span>
          <span class="text-xs uppercase tracking-widest text-brand-400 font-semibold ml-2 px-2 py-0.5 rounded bg-brand-950 border border-brand-800">IoT Cloud</span>
        </div>
      </div>
      <a href="/" class="text-sm text-slate-400 hover:text-brand-400 flex items-center space-x-1.5 transition">
        <span>Dashboard</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </a>
    </div>
  </header>

  <!-- Main Auth Container -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="w-full max-w-md bg-[#0e1713] border border-[#1c3427] rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-xl relative overflow-hidden">
      
      <!-- Top green highlight line -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-brand-600 via-brand-400 to-emerald-300"></div>

      <!-- Title & Branding -->
      <div class="text-center mb-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Access Portal</h1>
        <p class="text-slate-400 text-sm mt-1">Sign in to manage IoT sensors, LCD & hardware controls</p>
      </div>

      <!-- Auth Tabs Switcher -->
      <div class="grid grid-cols-2 bg-[#070d0a] p-1 rounded-xl border border-[#1c3427] mb-6">
        <button id="tab-login" onclick="switchAuthTab('login')" class="py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-brand-600 text-black shadow-md">
          Sign In
        </button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white">
          Register
        </button>
      </div>

      <!-- Alert Notification Banner -->
      <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-xl text-sm border flex items-start space-x-2.5">
        <i id="alert-icon" data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <span id="alert-msg" class="leading-snug"></span>
      </div>

      <!-- LOGIN FORM -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5" for="login-email">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="email" 
              id="login-email" 
              required 
              placeholder="user@example.com" 
              value="admin@sky.iot"
              class="w-full bg-[#14221b] border border-[#1c3427] focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300" for="login-password">Password</label>
            <span class="text-xs text-brand-400 font-mono">Demo: sky12345</span>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="password" 
              id="login-password" 
              required 
              placeholder="••••••••" 
              value="sky12345"
              class="w-full bg-[#14221b] border border-[#1c3427] focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none"
            >
          </div>
        </div>

        <button 
          type="submit" 
          id="btn-login-submit"
          class="w-full mt-2 py-3 px-4 bg-brand-500 hover:bg-brand-400 text-black font-bold text-sm rounded-xl transition duration-200 shadow-lg shadow-brand-500/25 flex items-center justify-center space-x-2"
        >
          <span>Sign In to Dashboard</span>
          <i data-lucide="log-in" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- REGISTRATION FORM (Hidden by default) -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5" for="reg-name">Full Name</label>
          <div class="relative">
            <i data-lucide="user" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="text" 
              id="reg-name" 
              required 
              placeholder="Rohit Vijay" 
              class="w-full bg-[#14221b] border border-[#1c3427] focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5" for="reg-email">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="email" 
              id="reg-email" 
              required 
              placeholder="engineer@sky.iot" 
              class="w-full bg-[#14221b] border border-[#1c3427] focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5" for="reg-password">Password (min 6 characters)</label>
          <div class="relative">
            <i data-lucide="lock" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="password" 
              id="reg-password" 
              required 
              minlength="6"
              placeholder="••••••••" 
              class="w-full bg-[#14221b] border border-[#1c3427] focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none"
            >
          </div>
        </div>

        <button 
          type="submit" 
          id="btn-reg-submit"
          class="w-full mt-2 py-3 px-4 bg-brand-500 hover:bg-brand-400 text-black font-bold text-sm rounded-xl transition duration-200 shadow-lg shadow-brand-500/25 flex items-center justify-center space-x-2"
        >
          <span>Create Account</span>
          <i data-lucide="user-plus" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- System Notice -->
      <div class="mt-6 pt-5 border-t border-[#1c3427] text-center text-xs text-slate-500">
        <p>Connected Hardware: ESP8266 + DHT11 + 16x2 I2C LCD + D0 LED</p>
      </div>

    </div>
  </main>

  <!-- Footer (Strictly requested by User) -->
  <footer class="border-t border-[#1c3427] bg-[#0e1713]/90 py-5 px-6 text-center text-xs sm:text-sm text-slate-400">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span>
        <span class="font-medium text-slate-300">sky IoT Platform</span>
      </div>
      <p class="text-slate-400 text-xs text-center font-normal">
        Designed and Developed by Rohit nand Vijay, Dept. of Electrical Engineering, Gov. Engg............
      </p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();

    // Check if already authenticated, forward to dashboard
    if (Auth.isAuthenticated()) {
      window.location.href = '/';
    }

    function switchAuthTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const alertBox = document.getElementById('auth-alert');
      alertBox.classList.add('hidden');

      if (tab === 'login') {
        loginTab.className = 'py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-brand-600 text-black shadow-md';
        regTab.className = 'py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        regTab.className = 'py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-brand-600 text-black shadow-md';
        loginTab.className = 'py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white';
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
      lucide.createIcons();
    }

    function showAlert(msg, isSuccess = false) {
      const alertBox = document.getElementById('auth-alert');
      const alertMsg = document.getElementById('alert-msg');
      const alertIcon = document.getElementById('alert-icon');
      
      alertBox.classList.remove('hidden', 'bg-red-950/60', 'border-red-800', 'text-red-300', 'bg-emerald-950/60', 'border-brand-700', 'text-brand-300');
      
      if (isSuccess) {
        alertBox.classList.add('bg-emerald-950/60', 'border-brand-700', 'text-brand-300');
        alertIcon.setAttribute('data-lucide', 'check-circle-2');
      } else {
        alertBox.classList.add('bg-red-950/60', 'border-red-800', 'text-red-300');
        alertIcon.setAttribute('data-lucide', 'alert-triangle');
      }
      alertMsg.textContent = msg;
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      try {
        btn.disabled = true;
        btn.innerHTML = `<span class="inline-block animate-spin mr-2">⟳</span> Signing in...`;
        await Auth.login(email, password);
        showAlert('Login successful! Redirecting to dashboard...', true);
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } catch (err) {
        showAlert(err.message || 'Login failed. Please verify credentials.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In to Dashboard</span><i data-lucide="log-in" class="w-4 h-4 ml-1"></i>`;
        lucide.createIcons();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-reg-submit');

      try {
        btn.disabled = true;
        btn.innerHTML = `<span class="inline-block animate-spin mr-2">⟳</span> Creating account...`;
        await Auth.register(name, email, password);
        showAlert('Registration successful! Launching dashboard...', true);
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } catch (err) {
        showAlert(err.message || 'Registration failed. Please check inputs.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Create Account</span><i data-lucide="user-plus" class="w-4 h-4 ml-1"></i>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
